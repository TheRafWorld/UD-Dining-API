name: Daily Menu Scraper

on:
  schedule:
    # Runs every day at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub anytime

jobs:
  update-menu:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the workflow permission to commit changes back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Scraper Script
        run: python scrape.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cr-menu.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily CR menu JSON" && git push)